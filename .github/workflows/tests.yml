name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile CLI
        run: python -m py_compile bin/harness.py
      - name: Lint
        run: python -m ruff check bin/harness.py harness_core tests
      - name: Run tests
        run: python -m pytest tests/ --cov=harness --cov-report=term-missing
