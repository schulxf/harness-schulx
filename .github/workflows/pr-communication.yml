name: comunicação do PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  resumo-simples:
    runs-on: ubuntu-latest
    steps:
      - name: Ler a política da branch principal
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validar resumo e revisão PT-BR
        run: >-
          python .github/scripts/pr_summary.py
          --event "$GITHUB_EVENT_PATH"
          --output "$RUNNER_TEMP/pr-comment.md"

      - name: Criar ou atualizar comentário simples
        uses: actions/github-script@v7
        env:
          COMMENT_PATH: ${{ runner.temp }}/pr-comment.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- harness-simple-pr-summary -->';
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
