<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harness Hub Pixel Client</title>
    <link rel="stylesheet" href="./assets/vendor/xterm/xterm.css">
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Harness Hub</h1>
            <p>Live workspace</p>
          </div>
        </div>
        <div class="hud" aria-label="Hub status">
          <span id="connectionBadge" class="badge" data-state="connecting">Connecting</span>
          <span id="repoCount" class="badge">Repos 0</span>
          <span id="agentCount" class="badge">Agents 0</span>
          <span id="eventCount" class="badge">Events 0</span>
          <button id="menuButton" class="control-button control-button--accent" type="button">Menu</button>
          <button id="refreshButton" class="control-button" type="button">Refresh</button>
          <button id="openTerminalButton" class="control-button" type="button" disabled>Shell</button>
        </div>
      </header>

      <main class="layout">
        <section class="stage-panel" aria-label="Pixel hub">
          <div class="stage-toolbar">
            <div id="repoStrip" class="repo-strip" aria-label="Repositories"></div>
            <div class="stage-hint" id="stageHint">Loading hub world...</div>
          </div>
          <div id="gameViewport" class="game-viewport" tabindex="0" aria-label="Harness hub world">
            <canvas id="gameCanvas" width="1280" height="720"></canvas>
            <div id="agentLayer" class="agent-layer" aria-live="polite"></div>
          </div>
        </section>

        <aside class="inspector" aria-label="Agent details">
          <div class="panel inspector-head">
            <span class="section-kicker">Selected</span>
            <h2 id="inspectorTitle">Hub</h2>
            <p id="inspectorMeta">Waiting for hub state.</p>
          </div>
          <div id="inspectorBody" class="panel inspector-body"></div>
        </aside>
      </main>
    </div>

    <div id="menuRoot" class="menu-overlay" hidden></div>

    <div id="agentModal" class="agent-modal" hidden>
      <div class="agent-modal-scrim" data-close></div>
      <div class="agent-modal-window" role="dialog" aria-modal="true" aria-labelledby="amName">
        <header class="am-head">
          <span class="am-avatar" id="amAvatar" aria-hidden="true"></span>
          <div class="am-titles">
            <h2 id="amName">Agent</h2>
            <p id="amSub">role · state</p>
          </div>
          <span id="amStatus" class="am-status" data-state="idle">Disconnected</span>
          <button id="amClose" class="control-button" type="button" data-close aria-label="Close">✕</button>
        </header>
        <div class="am-body">
          <aside class="am-info" id="amInfo"></aside>
          <section class="am-term">
            <div class="am-term-bar">
              <span class="am-term-title" id="amTermTitle">Terminal</span>
              <div class="am-term-actions">
                <button id="amInterrupt" class="control-button" type="button" title="Send Ctrl+C">Ctrl+C</button>
                <button id="amClear" class="control-button" type="button">Clear</button>
                <button id="amReconnect" class="control-button" type="button">Reconnect</button>
                <button id="amKill" class="control-button control-button--danger" type="button">Stop agent</button>
              </div>
            </div>
            <div id="amTerm" class="am-term-mount" tabindex="0"></div>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
